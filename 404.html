<!-- ==================================================================
ПРОГРАММНЫЙ МОДУЛЬ ПРИЛОЖЕНИЯ
Состав: оформление, зависимости, геометрические инструменты и интерфейс.

<!--
РАБОТА ПРОГРАММЫ · HtmlCAD · контракт htmlcad.learning-app, версия 1

Этот блок содержит CSS, импорты, геометрические инструменты и поведение приложения.
Здесь нет геометрии конкретных моделей, кадров конкретной сборки или WOFF2/base64 шрифта.
Раздел HTMLCAD_PROGRAM_BEGIN/END определяет программный модуль приложения.
Модуль содержит оформление, зависимости, инструменты и обработчики интерфейса.
Его можно обновлять независимо от разделов ресурсов и данных моделей
при сохранении описанного ниже контракта данных и публичных методов.
Вложенные разделы обозначают границы компонентов CSS и JavaScript.

ПРИНЦИП РАБОТЫ
startLearningSite ждёт готовности DOM. readLearningSiteData читает инертные JSON-блоки,
затем createLearningSite строит каталог и просмотрщик. Модель выбирается по строковому id.
Сцена восстанавливается THREE.ObjectLoader.parse; отрисовка работает по требованию.
PartAnimationPlayer перемещает детали между абсолютными позами; ползунок задаёт долю кадра.
VisibilityWavePlayer изолирует именованные группы волной прозрачности и восстанавливает материалы.
CADOutlineRenderer строит периметр/угловые рёбра; LearningMeasureGeometry измеряет вершины и сечения.
Интерфейс, жесты телефона, подписи, сброс и методы интеграции находятся в createLearningSite.

ГДЕ ХРАНЯТСЯ ДАННЫЕ (все контейнеры расположены ПОСЛЕ этого блока)
1. htmlcad-font-data: application/json, объект {css:string}; встроенный Montserrat и лицензия.
   Ресурс необязателен: при его отсутствии применяется резервный шрифт.
2. htmlcad-app-data: application/json, индекс приложения:
   {schema:"htmlcad.learning-app",version:1,title,startMenu,showRandomModel?,template,options,
    models:[{id:string,name:string,dataId:string}]}.
   dataId ссылается на отдельный JSON-контейнер htmlcad-model-N.
   Одна модель открывается сразу; каталог используется при двух и более моделях.
   showRandomModel=false скрывает случайный выбор; при отсутствии поля он включён.
3. Каждый htmlcad-model-N содержит одну независимую модель:
   {id,sceneData,animation,showGroups,outlines,site,camera}.

ФОРМАТ 3D-МОДЕЛЕЙ
Это JSON Three.js Object3D.toJSON, а не исходные GLTF/GLB/STL и не внешние BIN-файлы.
sceneData.object — дерево объектов с матрицами и ссылками на ресурсы по UUID.
sceneData.geometries — геометрии. Примитивы (BoxGeometry, SphereGeometry и др.)
содержат параметры. Сложные BufferGeometry содержат data.attributes.position,
normal/uv и другие доступные атрибуты, а также data.index при наличии индексов.
sceneData.materials, textures, images содержат материалы, текстуры и изображения.
Изображения могут содержать встроенные данные. Не добавляйте вершины в рабочую логику.
Корни выбираемых деталей помечены userData.htmlCADPart={id,name,type};
id детали локален внутри модели. Пользовательские контуры — userData.htmlCADOutline.

ПОЗЫ, КАДРЫ И ПОКАЗ
animation.base: словарь idДетали -> {p:[x,y,z],q:[x,y,z,w],s:[x,y,z],m?:16 чисел}.
p — позиция, q — кватернион, s — масштаб; m сохраняет общую аффинную матрицу.
animation.frames:[{id,name,duration,poses}]; duration в секундах.
poses — абсолютные целевые позы; отсутствующие детали возвращаются к animation.base.
showGroups:[{id,name,duration,partIds:[idДетали]}] — независимые группы показа.
outlines:{enabled,color,width,angle}; width в пикселях, angle в градусах.

ШАБЛОН И ЭЛЕМЕНТЫ УПРАВЛЕНИЯ
site:{templateId,templates,controls,units,startMenu,selection?,measurement?,followMain?}; templates содержат палитру.
measurement:{precision:0..6,roundingEnabled:boolean,roundingStep:number>0,
 snapVertices,snapCenters,snapMidpoints,snapColor,pointColor,dimensionColor,arrowSize,fontSize}.
Привязки показываются квадратом snapColor; поставленные точки используют pointColor.
arrowSize (8–16 px) и fontSize (10–18 px) заданы в экранных пикселях.
LearningDimensionLayout.orientation задаёт единое направление чтения независимо от порядка
точек: вертикальный текст снизу вверх, остальные подписи читаются снизу или справа.
Для неудобного сектора наклонов и коротких линий строится горизонтальная полка-выноска.
Число размещается над читаемой базовой линией текста; положение линии на экране не меняет
сторону размещения числа. На размерной линии единицы опускаются, R/⌀ сохраняются.
Верхнее поле результата содержит размер с явно указанными единицами.
userData.htmlCADMeasureCircles содержит {center,u,v,start,sweep,full,analytic} в локальных
координатах детали; u/v — радиус-векторы. htmlCADMeasurePoints — середины прямых рёбер.
При отсутствии этих данных LearningMeasureSnaps вычисляет их из параметров и сетки.
Некруговое сечение при неравномерном масштабировании не используется как радиус/диаметр.
Шаг задан в единицах units.label. Округление до ближайшего кратного применяется к подписи
расстояния и габаритам; исходная геометрия и htmlCADSite.measurement.value остаются точными.
При смене единиц и наследовании интерфейса физическая величина шага сохраняется.
followMain включает наследование интерфейса от первой модели проекта при экспорте.
Действия сопоставляются по kind и имени, затем по порядку; локальные id и targetId сохраняются.
Названия локальных кадров/показов и подписи их кнопок сохраняются. Дополнительные действия
не скрываются: они используют стиль соответствующего действия главной модели, если он есть.
controls[].inheritance содержит имя действия/подпись главной и признаки совпадения названий.
Геометрия, кадры, группы показа, калибровка units и индивидуальные настройки деталей локальны.
selection:{enabled,showLabel,showName,color,displayName,description,showPosition,
 showDimensions,showMass,density,unit,dimensionFormat,precision,parts}.
parts — словарь локальныйIdДетали -> частичные переопределения настроек подписи и цвета.
enabled управляет выбором в просмотрщике и публичном API; измерения работают независимо.
density задаётся в кг/м³; масса вычисляется из объёма замкнутой согласованной сетки.
Незамкнутая сетка или нефизические единицы возвращают недоступную массу, а не оценку по габаритам.
unit: auto | мм | см | м; dimensionFormat: xyz | axes; precision: 0–6.
Габариты используют оси детали и масштаб, положение — центр в мировых координатах.
controls:[{id,kind,targetId?,label,group,format,enabled,row?,fontSize?,border?}].
row — номер ряда (1–50, по умолчанию 1); элементы размещаются без переноса внутри ряда.
fontSize — верхняя граница размера текста в пикселях (7–24, по умолчанию 12).
border — обводка кнопки reset (по умолчанию true); false скрывает рамку.
При нехватке ширины текст уменьшается автоматически. Группа служит редакторской иерархией.
kind: frame | show | outline | measure | section | reset.
format: button | slider; measure/reset остаются кнопками.
targetId ссылается на кадр или группу показа. Порядок массива задаёт порядок управления.
units:{label,perSceneUnit}; физическое расстояние = 3D-расстояние * perSceneUnit.
camera:{position:[x,y,z],target:[x,y,z]} — предпочтительный начальный ракурс.

ИНТЕГРАЦИЯ
window.htmlCADSite: openModel, showMenu, reset, setFrameProgress, setSection, setMeasure.
setMeasure(enabled,kind): kind = distance | radius | diameter.
measureSnap(x,y) и совместимый measureVertex(x,y) возвращают ближайшую привязку.
measurement:{value,unit,kind} — точное значение текущего размера.
window.htmlCADParts: parts, selectPart, clearSelection, selectedPart.
window.htmlCADAnimation: frames, playFrame, reset, activeFrameId, isPlaying.
window.htmlCADShowGroups: groups, toggle, showAll, activeGroupId, isPlaying.
События: htmlcad:modelchange, htmlcad:selectionchange, htmlcad:framechange,
htmlcad:showgroupchange. Идентификаторы моделей, деталей и целей нужно сохранять.
JSON читается через JSON.parse, без eval; шрифт, геометрия и параметры конкретных кадров
хранятся отдельно от программного модуля. Для новой версии схемы нужна явная миграция.
-->

<script type="module">
// Подключение Three.js и инструментов просмотра.
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {LineSegments2} from "three/addons/lines/LineSegments2.js";
import {LineSegmentsGeometry} from "three/addons/lines/LineSegmentsGeometry.js";

// ===== НАЧАЛО РАЗДЕЛА: Настройки интерфейса по умолчанию (defaultSiteSettings) =====
function defaultSiteSettings(){
  return {templateId:'standard',templates:[{id:'standard',name:'Учебный стандарт',background:'#ffffff',text:'#566366',main:'#748386',active:'#657477',border:'#d5d5d5'}],controls:[],units:{label:'мм',perSceneUnit:1},startMenu:true};

// ===== НАЧАЛО РАЗДЕЛА: Чтение положения детали (readPartPose) =====
function readPartPose(mesh) {
  const pose = { p: mesh.position.toArray(), q: mesh.quaternion.toArray(), s: mesh.scale.toArray() };
  if (!mesh.matrixAutoUpdate) pose.m = mesh.matrix.toArray();
  return pose;
}
// ===== КОНЕЦ РАЗДЕЛА: Чтение положения детали (readPartPose) =====

// ===== НАЧАЛО РАЗДЕЛА: Применение положения детали (applyPartPose) =====
function applyPartPose(mesh, pose) {
  mesh.position.fromArray(pose.p);
  mesh.quaternion.fromArray(pose.q);
  mesh.scale.fromArray(pose.s);
  mesh.matrixAutoUpdate = !pose.m;
  if (pose.m) mesh.matrix.fromArray(pose.m);
  else mesh.updateMatrix();
  mesh.matrixWorldNeedsUpdate = true;
}
// ===== КОНЕЦ РАЗДЕЛА: Применение положения детали (applyPartPose) =====

// ===== НАЧАЛО РАЗДЕЛА: Анимация деталей и кадров (PartAnimationPlayer) =====
class PartAnimationPlayer {
  constructor(parts, base) {
    this.parts = parts;
    this.base = base;
    this.active = null;
  }

  static residual(pose) {
    const matrix = new THREE.Matrix4();
    if (!pose.m) return matrix;
    matrix.compose(new THREE.Vector3().fromArray(pose.p), new THREE.Quaternion().fromArray(pose.q), new THREE.Vector3().fromArray(pose.s));
    return matrix.invert().multiply(new THREE.Matrix4().fromArray(pose.m));
  }

  play(poses, duration = 1200, now = performance.now()) {
    this.update(now);
    const entries = [];
    this.parts.forEach((mesh, id) => {
      const to = poses[id] || this.base[id];
      if (!to) return;
      const from = readPartPose(mesh);
      entries.push({ mesh, from, to, p: new THREE.Vector3().fromArray(to.p), q: new THREE.Quaternion().fromArray(to.q),
        s: new THREE.Vector3().fromArray(to.s), a: PartAnimationPlayer.residual(from), b: PartAnimationPlayer.residual(to) });
    });
    this.active = { entries, start: now, duration: Math.max(0, Number.isFinite(duration) ? duration : 1200) };
    this.update(now);
  }

  update(now) {
    if (!this.active) return false;
    const { entries, start, duration } = this.active;
    const t = duration === 0 ? 1 : Math.min(1, Math.max(0, (now - start) / duration));
    const eased = t * t * (3 - 2 * t);
    entries.forEach(({ mesh, from, to, p, q, s, a, b }) => {
      if (t === 1) { applyPartPose(mesh, to); return; }
      mesh.position.fromArray(from.p).lerp(p, eased);
      mesh.quaternion.fromArray(from.q).slerp(q, eased);
      mesh.scale.fromArray(from.s).lerp(s, eased);
      mesh.matrixAutoUpdate = !(from.m || to.m);
      mesh.updateMatrix();
      if (!mesh.matrixAutoUpdate) {
        const residual = new THREE.Matrix4();
        residual.elements = a.elements.map((value, i) => value + (b.elements[i] - value) * eased);
        mesh.matrix.multiply(residual);
      }
      mesh.matrixWorldNeedsUpdate = true;
    });
    if (t === 1) this.active = null;
    return true;
  }

  stop() { this.active = null; }
}
// ===== КОНЕЦ РАЗДЕЛА: Анимация деталей и кадров (PartAnimationPlayer) =====

// ===== НАЧАЛО РАЗДЕЛА: Удаление служебных объектов (stripCADHelpers) =====
function stripCADHelpers(root) {
  const remove = [];
  root.traverse(node => { if (node.userData.htmlCADEdge) remove.push(node); });
  remove.forEach(node => node.removeFromParent());
  return root;
}
// ===== КОНЕЦ РАЗДЕЛА: Удаление служебных объектов (stripCADHelpers) =====

// ===== НАЧАЛО РАЗДЕЛА: Шкала фильма (FilmTimeline) =====
class FilmTimeline {
  static labels = {
    pose: 'Положение',
    move: 'Перемещение и поворот',
    rotate: 'Поворот',
    camera: 'Камера',
    opacity: 'Прозрачность',
    color: 'Цвет',
    paint: 'Снимок цвета'
  };

  constructor(film) {
    this.parts = new Map();
    this.camera = [];
    this.duration = Math.max(0, ...film.actions.map(action => action.start + action.duration));
    const baseline = film.baselines?.find(item => item.id === film.baselineId) || film.baselines?.[0];
    this.baseView = baseline?.view || film.baseView;
    this.baseParts = baseline?.parts || film.baseParts || {};
    const actions = [...film.actions].sort((a, b) => a.start - b.start);
    for (const action of actions) {
      if (action.kind === 'camera') {
        this.add(this.camera, action, this.baseView);
        continue;
      }
      for (const id of action.targets) {
        if (!this.parts.has(id)) this.parts.set(id, {});
        const tracks = this.parts.get(id);
        const insert = (key, kind, value, initial = FilmTimeline.initial(kind), absolute = false) => {
          tracks[key] ??= [];
          this.add(tracks[key], { ...action, kind, value, absolute }, initial);
        };
        const base = this.baseParts[id];
        if (action.kind === 'rotate' && action.value.pivot && base) {
          const initial = FilmTimeline.initial('move');
          const from = this.sample(tracks.orbit, action.start, initial);
          const arm = new THREE.Vector3().fromArray(this.poseAt(id, action.start, base.pose).p)
            .sub(new THREE.Vector3().fromArray(action.value.pivot));
          (tracks.orbit ??= []).push({ ...action, kind: 'orbit', to: action.value, from, arm });
          insert('rotate', 'rotate', action.value);
        } else if (action.kind === 'move' && action.value && !Array.isArray(action.value)) {
          const move = action.value.move || [0, 0, 0];
          const turns = action.value.turns || [];
          if (turns.length && action.value.pivot && base) {
            const initial = FilmTimeline.initial('move');
            const from = this.sample(tracks.orbit, action.start, initial);
            const arm = new THREE.Vector3().fromArray(this.poseAt(id, action.start, base.pose).p)
              .sub(new THREE.Vector3().fromArray(action.value.pivot));
            const rotValue = { pivot: action.value.pivot, turns };
            (tracks.orbit ??= []).push({ ...action, kind: 'orbit', to: rotValue, from, arm });
            insert('rotate', 'rotate', rotValue);
          }
          if (move.some(v => Math.abs(v) > 1e-12) || !turns.length) {
            insert('move', 'move', move);
          }
        } else if (action.kind === 'pose') {
          const value = action.value[id];
          if (base && value) {
            const orbit = this.sample(tracks.orbit, action.start, FilmTimeline.initial('move'));
            if (value.p) insert('move', 'move', value.p.map((coordinate, i) => coordinate - base.pose.p[i] - orbit[i]), undefined, true);
            if (value.q) {
              const end = new THREE.Quaternion().fromArray(value.q)
                .multiply(new THREE.Quaternion().fromArray(base.pose.q).invert()).toArray();
              insert('rotate', 'rotate', { end, turns: value.turns });
            }
          }
        } else if (action.kind === 'paint' || (action.kind === 'color' && base?.colors.some(Boolean))) {
          base?.colors.forEach((color, slot) => {
            const destination = action.kind === 'color' ? new THREE.Color(action.value).toArray() : action.value[id]?.[slot];
            if (color && destination) insert('color:' + slot, 'paint', destination, color);
          });
        } else if (action.kind === 'opacity') {
          const baseHidden = base?.visible === false || (base?.materials?.length > 0 && base.materials.every(m => m && m.opacity <= 1e-5));
          insert('opacity', 'opacity', action.value, baseHidden ? [0, 0] : FilmTimeline.initial('opacity'));
        } else insert(action.kind, action.kind, action.value);
      }
    }
  }

  static initial(kind) {
    const values = { move: [0, 0, 0], rotate: [0, 0, 0, 1], opacity: [1, 0], color: [0, 0, 0, 0] };
    return values[kind];
  }

  add(track, action, initial) {
    if (action.kind === 'camera' && track.length > 0) {
      const prev = track[track.length - 1];
      if (prev.start + prev.duration > action.start + 1e-6) {
        prev.duration = Math.max(0.01, action.start - prev.start);
      }
    }
    const from = action.kind === 'camera' && track.length > 0
      ? track[track.length - 1].to
      : this.sample(track, action.start, initial);
    let to = action.value;
    if (action.kind === 'move' && !action.absolute) to = from.map((value, i) => value + action.value[i]);
    if (action.kind === 'color') {
      const color = new THREE.Color(to);
      to = [color.r, color.g, color.b, 1];
    }
    if (action.kind === 'opacity') to = action.absoluteOpacity !== false ? [0, to] : [to, 0];
    const axis = action.kind === 'rotate' && !to.end && !to.pivot ?
      new THREE.Vector3(...['x', 'y', 'z'].map(key => Number(key === action.value.axis))) : null;
    let correction;
    if (action.kind === 'rotate' && to.end) {
      const endpoint = FilmTimeline.turn(to.turns).multiply(new THREE.Quaternion().fromArray(from));
      correction = new THREE.Quaternion().fromArray(to.end).multiply(endpoint.invert());
    }
    track.push({ ...action, from, to, axis, correction });
  }

  static turn(angles, fraction = 1) {
    const radians = angles.map(angle => THREE.MathUtils.degToRad(angle) * fraction);
    return new THREE.Quaternion().setFromEuler(new THREE.Euler(...radians, 'ZYX'));
  }

  static groupTurn(turns, progress = 1) {
    const rotation = new THREE.Quaternion();
    const axis = new THREE.Vector3();
    let remaining = progress * turns.length;
    for (const turn of turns) {
      if (remaining <= 0) break;
      axis.set(0, 0, 0).setComponent('xyz'.indexOf(turn.axis), 1);
      rotation.premultiply(new THREE.Quaternion().setFromAxisAngle(axis,
        THREE.MathUtils.degToRad(turn.angle) * Math.min(1, remaining)));
      remaining--;
    }
    return rotation;
  }

  sample(track, time, initial) {
    if (!track?.length || track[0].start > time) return initial;
    let low = 0, high = track.length - 1;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      if (track[middle].start <= time) low = middle;
      else high = middle - 1;
    }
    const { kind, start, duration, from, to, axis, correction, arm } = track[low];
    const progress = THREE.MathUtils.clamp((time - start) / duration, 0, 1);
    const lerp = (a, b) => THREE.MathUtils.lerp(a, b, progress);
    if (kind === 'orbit') {
      const delta = arm.clone().applyQuaternion(FilmTimeline.groupTurn(to.turns, progress)).sub(arm);
      return from.map((coordinate, i) => coordinate + delta.getComponent(i));
    }
    if (kind === 'rotate') {
      if (to.pivot) {
        return FilmTimeline.groupTurn(to.turns, progress).multiply(new THREE.Quaternion().fromArray(from)).toArray();
      }
      if (to.end) {
        return new THREE.Quaternion().slerp(correction, progress)
          .multiply(FilmTimeline.turn(to.turns, progress))
          .multiply(new THREE.Quaternion().fromArray(from)).toArray();
      }
      return new THREE.Quaternion().setFromAxisAngle(axis, THREE.MathUtils.degToRad(to.angle) * progress)
        .multiply(new THREE.Quaternion().fromArray(from)).toArray();
    }
    if (kind === 'camera') {
      if (progress === 0) return from;
      if (progress === 1) return to;
      const activeMode = to.mode || from.mode;
      const freeZoom = from.freeZoom || to.freeZoom;
      const scale = (a, b) => freeZoom && a > 0 && b > 0 ?
        Math.exp(lerp(Math.log(a), Math.log(b))) : lerp(a, b);
      const distance = scale(from.distance, to.distance);
      const fromRotation = new THREE.Quaternion().fromArray(from.rotation);
      const toRotation = new THREE.Quaternion().fromArray(to.rotation);
      const straight = freeZoom && activeMode === 'perspective' && to.mode === from.mode &&
        Math.abs(fromRotation.dot(toRotation)) > 1 - 1e-10 && from.distance !== to.distance;
      const travel = straight ? THREE.MathUtils.clamp((distance - from.distance) / (to.distance - from.distance), 0, 1) : progress;
      const fromAspect = from.aspect > 0 ? from.aspect : 1.45;
      const toAspect = to.aspect > 0 ? to.aspect : fromAspect;
      const view = {
        mode: activeMode,
        target: from.target.map((value, i) => THREE.MathUtils.lerp(value, to.target[i], travel)),
        rotation: fromRotation.slerp(toRotation, progress).toArray(),
        height: scale(from.height, to.height),
        aspect: lerp(fromAspect, toAspect),
        distance
      };
      if (freeZoom) {
        const nominal = activeMode === 'orthographic' ? [-5000, 10000] : [0.1, 10000];
        const validClip = (c, m) => c?.length === 2 && (m === 'orthographic' || c[0] > 0) ? c : nominal;
        const a = validClip(from.clip, activeMode);
        const b = validClip(to.clip, activeMode);
        view.freeZoom = true;
        view.clip = a.map((value, i) => scale(value, b[i]));
      }
      return view;
    }
    return from.map((value, i) => lerp(value, to[i]));
  }

  viewAt(time) {
    return this.sample(this.camera, time, this.baseView);
  }

  poseAt(id, time, original) {
    const tracks = this.parts.get(id);
    const base = this.baseParts[id]?.pose || original;
    const offset = this.sample(tracks?.move, time, FilmTimeline.initial('move'));
    const orbit = this.sample(tracks?.orbit, time, FilmTimeline.initial('move'));
    const rotation = new THREE.Quaternion().fromArray(this.sample(tracks?.rotate, time, FilmTimeline.initial('rotate')));
    return FilmTimeline.applyOffset(base, offset.map((value, i) => value + orbit[i]), rotation);
  }

  static rotateAbout(pose, pivot, rotation) {
    const arm = new THREE.Vector3().fromArray(pose.p).sub(pivot);
    const offset = arm.clone().applyQuaternion(rotation).sub(arm);
    return FilmTimeline.applyOffset(pose, offset.toArray(), rotation);
  }

  static applyOffset(base, offset, rotation) {
    const pose = {
      ...base,
      p: base.p.map((coordinate, i) => coordinate + offset[i]),
      q: rotation.clone().multiply(new THREE.Quaternion().fromArray(base.q)).toArray()
    };
    if (base.m) {
      pose.m = new THREE.Matrix4().makeRotationFromQuaternion(rotation)
        .multiply(new THREE.Matrix4().fromArray(base.m)).setPosition(...pose.p).toArray();
    }
    return pose;
  }

  colorsAt(id, time) {
    const tracks = this.parts.get(id);
    return this.baseParts[id]?.colors?.map((color, slot) => color && this.sample(tracks?.['color:' + slot], time, color));
  }

  appearanceAt(id, time, edits) {
    const tracks = this.parts.get(id), base = this.baseParts[id];
    const baseHidden = base?.visible === false || (base?.materials?.length > 0 && base.materials.every(m => m && m.opacity <= 1e-5));
    const initialOpacity = baseHidden ? [0, 0] : FilmTimeline.initial('opacity');
    const opacity = this.sample(edits?.opacity ? null : tracks?.opacity, time, initialOpacity);
    const hasOpacityTrack = Boolean(tracks?.opacity?.length);
    return {
      visible: hasOpacityTrack ? opacity.some(v => v > 1e-5) : base?.visible,
      materials: edits?.opacity ? null : base?.materials,
      opacity,
      tint: edits?.color ? null : this.sample(tracks?.color, time, null),
      colors: edits?.color ? null : this.colorsAt(id, time)
    };
  }
}

// ===== НАЧАЛО РАЗДЕЛА: Положения, материалы и камера фильма (FilmScene) =====
class FilmScene {
  constructor() { this.materials = new Map(); this.restore = []; }

  static applyView(camera, view) {
    const currentAspect = camera.isOrthographicCamera
      ? (camera.right - camera.left) / Math.max(1e-6, camera.top - camera.bottom)
      : (camera.aspect || 1);
    const authoredAspect = view.aspect > 0 ? view.aspect : 1.45;
    // Only adapt aspect scale on narrow portrait mobile screens (currentAspect < 0.85).
    // On desktop / landscape viewports, preserve the exact authored height and distance 1:1.
    const isPortraitPhone = currentAspect > 0 && currentAspect < 0.85 && authoredAspect >= 0.85;
    const aspectScale = isPortraitPhone ? Math.min(authoredAspect, 1.35) / currentAspect : 1;
    const effectiveHeight = view.height * aspectScale;
    if (camera.isPerspectiveCamera && camera.zoom !== 1) camera.zoom = 1;
    const distance = camera.isPerspectiveCamera
      ? (isPortraitPhone ? effectiveHeight * camera.zoom / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) : (view.distance > 0 ? view.distance : effectiveHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2))))
      : view.distance;
    camera.quaternion.fromArray(view.rotation);
    camera.position.set(0, 0, distance).applyQuaternion(camera.quaternion).add(new THREE.Vector3().fromArray(view.target));
    if (camera.isOrthographicCamera) camera.zoom = (camera.top - camera.bottom) / effectiveHeight;
    const clip = view.clip;
    if (clip?.length === 2 && clip.every(Number.isFinite) && clip[1] > clip[0] &&
        (camera.isOrthographicCamera || clip[0] > 0)) {
      camera.userData.htmlCADBaseClip ??= [camera.near, camera.far];
      camera.userData.htmlCADShotClip = true;
      [camera.near, camera.far] = [clip[0], clip[1] * aspectScale];
    } else this.restoreClip(camera);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
  }

  static restoreClip(camera) {
    const data = camera.userData;
    if (!data.htmlCADShotClip) return;
    [camera.near, camera.far] = data.htmlCADBaseClip;
    delete data.htmlCADShotClip;
    camera.updateProjectionMatrix();
  }

  apply(timeline, parts, time) {
    this.reset();
    for (const [id, mesh] of parts) {
      const tracks = timeline.parts.get(id);
      if (!tracks && !timeline.baseParts[id]) continue;
      const pose = readPartPose(mesh), visible = mesh.visible;
      this.restore.push(() => {
        mesh.visible = visible;
        applyPartPose(mesh, pose);
        mesh.updateMatrixWorld(true);
      });
      const appearance = timeline.appearanceAt(id, time);
      applyPartPose(mesh, timeline.poseAt(id, time, pose));
      mesh.visible = (appearance.visible ?? visible) && appearance.opacity.some(v => v > 1e-5);
      if (mesh.visible) this.applyAppearance(mesh, appearance, this.restore);
    }
  }

  reset() {
    while (this.restore.length) this.restore.pop()();
  }

  dispose() {
    this.reset();
    for (const cache of this.materials.values()) for (const material of cache.values()) material.dispose();
    this.materials.clear();
  }

  materialAppearance(material, appearance, slot) {
    if (!appearance) return material;
    const base = appearance.materials?.[slot] || material;
    const [factor, fixed] = appearance.opacity;
    const opacity = THREE.MathUtils.clamp(base.opacity * factor + fixed, 0, 1);
    const tint = slot >= 0 ? appearance.tint : null;
    const channels = appearance.colors?.[slot];
    let color = material.color;
    if (color && channels) color = new THREE.Color().fromArray(channels);
    else if (color && tint?.[3]) {
      color = color.clone().multiplyScalar(1 - tint[3]);
      color.r += tint[0]; color.g += tint[1]; color.b += tint[2];
    }
    const changed = factor !== 1 || fixed !== 0;
    const transparent = changed ? opacity < 0.9999 : (base.transparent || opacity < 0.9999);
    const depthWrite = changed ? opacity >= 0.9999 : (base.depthWrite && opacity >= 0.9999);
    return { color, opacity, transparent, depthWrite };
  }

  applyAppearance(mesh, appearance, restore) {
    if (!this.materials.has(mesh)) this.materials.set(mesh, new Map());
    const cache = this.materials.get(mesh);
    let slot = 0;
    mesh.traverse(node => {
      if (!node.material) return;
      const original = node.material;
      const convert = (material, index) => {
        const materialSlot = node.userData.htmlCADEdge ? -1 : slot++;
        if (!material) return material;
        const state = this.materialAppearance(material, appearance, materialSlot);
        if (material.opacity === state.opacity && material.transparent === state.transparent &&
            material.depthWrite === state.depthWrite && (!state.color || material.color.equals(state.color))) return material;
        const key = node.id + ':' + index;
        let copy = cache.get(key);
        if (copy?.userData.htmlCADFilmSource !== material.uuid) {
          copy?.dispose();
          copy = material.clone();
          copy.userData.htmlCADFilmSource = material.uuid;
          cache.set(key, copy);
        }
        copy.opacity = state.opacity;
        if (copy.transparent !== state.transparent) { copy.transparent = state.transparent; copy.needsUpdate = true; }
        copy.depthWrite = state.depthWrite;
        if (state.color) copy.color.copy(state.color);
        return copy;
      };
      node.material = Array.isArray(original) ? original.map(convert) : convert(original, 0);
      restore.push(() => { node.material = original; });
    });
  }

}

// ===== НАЧАЛО РАЗДЕЛА: Чтение геометрии для инструментов (collectCADGeometry) =====
function collectCADGeometry(root, relativeTo = null) {
  root.updateWorldMatrix(true, true);
  const inverse = relativeTo ? relativeTo.matrixWorld.clone().invert() : new THREE.Matrix4();
  const positions = [], normals = [], uvs = [];
  const point = new THREE.Vector3(), normal = new THREE.Vector3();
  root.traverse(mesh => {
    if (!mesh.isMesh || mesh.userData.htmlCADEdge || !mesh.geometry?.attributes.position) return;
    const geometry = mesh.geometry, position = geometry.attributes.position;
    const matrix = inverse.clone().multiply(mesh.matrixWorld);
    const normalMatrix = new THREE.Matrix3().getNormalMatrix(matrix);
    const index = geometry.index;
    const count = index ? index.count : position.count;
    const mirrored = matrix.determinant() < 0;
    for (let i = 0; i + 2 < count; i += 3) {
      for (const k of mirrored ? [0, 2, 1] : [0, 1, 2]) {
        const j = index ? index.getX(i + k) : i + k;
        point.fromBufferAttribute(position, j).applyMatrix4(matrix);
        positions.push(point.x, point.y, point.z);
        if (geometry.attributes.normal) normal.fromBufferAttribute(geometry.attributes.normal, j).applyNormalMatrix(normalMatrix);
        else normal.set(0, 0, 0);
        normals.push(normal.x, normal.y, normal.z);
        const uv = geometry.attributes.uv;
        uvs.push(uv ? uv.getX(j) : 0, uv ? uv.getY(j) : 0);
      }
    }
  });
  const geometry = new THREE.BufferGeometry();

// ===== НАЧАЛО РАЗДЕЛА: Запуск приложения после готовности страницы (startLearningSite) =====
function startLearningSite(){
  const start=async()=>{
    let loader=null;
    try{
      const node=document.getElementById('htmlcad-app-data');
      const previewManifest=node?JSON.parse(node.textContent):null;
      const isBinaryChunked=Array.isArray(previewManifest?.binaryChunks)&&previewManifest.binaryChunks.length>0;
      const isChunked=isBinaryChunked||(Array.isArray(previewManifest?.models)&&previewManifest.models.some(m=>m.baseUrl));
      let loaded;
      if(isChunked){
        const fontNode=document.getElementById('htmlcad-font-data');
        const fontData=fontNode?JSON.parse(fontNode.textContent):null;
        if(fontData?.css){const style=document.createElement('style');style.id='htmlcad-embedded-fonts';style.textContent=fontData.css;document.head.appendChild(style);}
        const bg=previewManifest.template?.background||'#ffffff',fg=previewManifest.template?.text||'#566366',main=previewManifest.template?.main||'#748386';
        const opts=previewManifest.options||{};
        const loadTitle=opts.loadingTitle!==undefined?opts.loadingTitle:(previewManifest.title||'');
        const loadStatus=opts.loadingStatus!==undefined?opts.loadingStatus:'Загрузка 3D-модели…';
        const loadUnpack=opts.loadingUnpack!==undefined?opts.loadingUnpack:'Распаковка 3D-геометрии…';
        const showParts=opts.loadingShowParts!==false;
        loader=document.createElement('div');
        loader.id='htmlcad-chunk-loader';
        loader.style.cssText=`position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:${bg};color:${fg};font:600 14px/1.4 Montserrat,Arial,sans-serif;z-index:9999;padding:24px;text-align:center`;
        const titleEl=document.createElement('div');
        titleEl.textContent=loadTitle;
        titleEl.hidden=!loadTitle;
        titleEl.style.cssText='font-size:16px;font-weight:800';
        const barWrap=document.createElement('div');
        barWrap.style.cssText='width:min(320px,80vw);height:8px;border-radius:999px;background:#e8e8e8;overflow:hidden';
        const barFill=document.createElement('div');
        barFill.style.cssText=`width:5%;height:100%;background:${main};transition:width .15s`;
        barWrap.appendChild(barFill);
        const statusEl=document.createElement('div');
        statusEl.style.cssText='font-size:12px;opacity:0.8';
        statusEl.textContent=loadStatus;
        statusEl.hidden=!loadStatus&&!loadUnpack;
        loader.append(titleEl,barWrap,statusEl);
        document.body.appendChild(loader);
        if(isBinaryChunked){
          const urls=previewManifest.binaryChunks;
          const partBlobs=[];
          for(let i=0;i<urls.length;i++){
            const pct=Math.round((i/urls.length)*80);
            barFill.style.width=Math.max(5,pct)+'%';
            const partSuffix=showParts&&urls.length>1?` (${i+1} / ${urls.length})`:'';
            statusEl.textContent=loadStatus?(loadStatus+partSuffix):partSuffix.trim();
            const res=await fetch(urls[i]);
            if(!res.ok)throw new Error('Не удалось загрузить '+urls[i]+' ('+res.status+')');
            partBlobs.push(await res.blob());
          }
          barFill.style.width='90%';
          if(loadUnpack)statusEl.textContent=loadUnpack;
          await new Promise(r=>setTimeout(r,10));
          const combinedBlob=new Blob(partBlobs);
          const rawBuffer=previewManifest.compressed&&typeof DecompressionStream==='function'
            ?await new Response(combinedBlob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
            :await combinedBlob.arrayBuffer();
          const view=new DataView(rawBuffer);
          const jsonLen=view.getUint32(0,true);
          const jsonText=new TextDecoder('utf-8').decode(new Uint8Array(rawBuffer,4,jsonLen));
          const models=JSON.parse(jsonText);
          const binStart=4+jsonLen+((4-((4+jsonLen)&3))&3);
          const restoreRef=ref=>{
            if(!ref||!ref.$bin)return ref;
            const byteOff=binStart+ref.offset;
            if(ref.$bin==='f32')return new Float32Array(rawBuffer,byteOff,ref.count);
            if(ref.$bin==='u16')return new Uint16Array(rawBuffer,byteOff,ref.count);
            if(ref.$bin==='u32')return new Uint32Array(rawBuffer,byteOff,ref.count);
            return ref;
          };
          for(const m of models){
            for(const geo of (m.sceneData?.geometries||[])){
              const attrs=geo?.data?.attributes;
              if(attrs){
                for(const attr of Object.values(attrs)){
                  if(attr?.array?.$bin)attr.array=restoreRef(attr.array);
                }
              }
              if(geo?.data?.index?.array?.$bin)geo.data.index.array=restoreRef(geo.data.index.array);
            }
          }
          loader.remove();loader=null;
          createLearningSite({title:previewManifest.title,startMenu:previewManifest.startMenu,showRandomModel:previewManifest.showRandomModel!==false,template:previewManifest.template,models},previewManifest.options||{});
          return;
        }
        const totalSteps=previewManifest.models.reduce((sum,m)=>sum+1+(Array.isArray(m.geoChunks)?m.geoChunks.length:0),0);
        let doneSteps=0;
        const step=(label)=>{
          doneSteps++;
          const pct=Math.min(100,Math.round(doneSteps/Math.max(1,totalSteps)*100));
          barFill.style.width=pct+'%';
          statusEl.textContent=`Загрузка 3D-модели: ${pct}% (${doneSteps} из ${totalSteps}) · ${label}`;
        };
        const ids=new Set(),models=[];
        for(const entry of previewManifest.models){
          if(typeof entry.id!=='string'||!entry.id||ids.has(entry.id))throw new Error('Некорректный id модели.');
          ids.add(entry.id);
          const baseRes=await fetch(entry.baseUrl);
          if(!baseRes.ok)throw new Error('Не удалось загрузить '+entry.baseUrl+' ('+baseRes.status+')');
          const data=await baseRes.json();
          step(entry.name);
          data.sceneData.geometries=data.sceneData.geometries||[];
          for(const chunk of (entry.geoChunks||[])){
            if(typeof chunk==='string'){
              const res=await fetch(chunk);
              if(!res.ok)throw new Error('Не удалось загрузить часть '+chunk+' ('+res.status+')');
              const geos=await res.json();
              for(let i=0;i<geos.length;i++)data.sceneData.geometries.push(geos[i]);
              step(entry.name);
            }else if(Array.isArray(chunk?.split)){
              const parts=[];
              for(const sliceUrl of chunk.split){
                const res=await fetch(sliceUrl);
                if(!res.ok)throw new Error('Не удалось загрузить фрагмент '+sliceUrl+' ('+res.status+')');
                parts.push(await res.text());
              }
              data.sceneData.geometries.push(JSON.parse(parts.join('')));
              step(entry.name);
            }
          }
          models.push({...data,name:entry.name});
        }
        loader.remove();loader=null;
        createLearningSite({title:previewManifest.title,startMenu:previewManifest.startMenu,showRandomModel:previewManifest.showRandomModel!==false,template:previewManifest.template,models},previewManifest.options||{});
        return;
      }
      loaded=readLearningSiteData();
      if(loaded.fontCSS){const style=document.createElement('style');style.id='htmlcad-embedded-fonts';style.textContent=loaded.fontCSS;document.head.appendChild(style);}
      createLearningSite(loaded.bundle,loaded.options);
    }catch(error){
      if(loader)loader.remove();
      const message=document.createElement('p');message.id='htmlcad-startup-error';message.setAttribute('role','alert');
      message.textContent='Не удалось открыть приложение: '+error.message;message.style.cssText='padding:24px;font:500 14px/1.5 Arial,sans-serif;color:#566366';document.body.appendChild(message);console.error(error);
    }
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
}

// Запуск рабочей логики.
startLearningSite();
</script>
